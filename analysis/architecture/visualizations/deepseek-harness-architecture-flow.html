.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;dsh-architecture-flow&quot; class=&quot;viz-root&quot;&gt;
  &lt;style&gt;
    #dsh-architecture-flow {
      --muted-bg: color-mix(in srgb, var(--foreground) 5%, transparent);
      --blue-bg: color-mix(in srgb, var(--blue) 12%, transparent);
      --green-bg: color-mix(in srgb, var(--green) 12%, transparent);
      --orange-bg: color-mix(in srgb, var(--orange) 13%, transparent);
      --purple-bg: color-mix(in srgb, var(--purple) 12%, transparent);
      --red-bg: color-mix(in srgb, var(--red) 10%, transparent);
      color: var(--foreground);
      font-family: var(--font-sans);
      padding: 4px;
    }
    #dsh-architecture-flow * { box-sizing: border-box; }
    #dsh-architecture-flow .header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    #dsh-architecture-flow h1 { font-size: 24px; line-height: 1.2; margin: 0 0 5px; letter-spacing: -.02em; }
    #dsh-architecture-flow .subtitle { color: var(--muted-foreground); font-size: 13px; }
    #dsh-architecture-flow .tabs { display: flex; gap: 6px; flex: 0 0 auto; }
    #dsh-architecture-flow .tab { border: 1px solid var(--border); background: transparent; color: var(--muted-foreground); border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    #dsh-architecture-flow .tab:hover { background: var(--muted-bg); color: var(--foreground); }
    #dsh-architecture-flow .tab.active { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
    #dsh-architecture-flow .panel[hidden] { display: none; }
    #dsh-architecture-flow .section-label { color: var(--muted-foreground); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px; }
    #dsh-architecture-flow .node { border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; background: var(--card); min-width: 0; }
    #dsh-architecture-flow .node strong { display: block; font-size: 13px; margin-bottom: 3px; }
    #dsh-architecture-flow .node span { color: var(--muted-foreground); font-size: 11px; line-height: 1.35; display: block; }
    #dsh-architecture-flow .blue { background: var(--blue-bg); border-color: color-mix(in srgb, var(--blue) 45%, var(--border)); }
    #dsh-architecture-flow .green { background: var(--green-bg); border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }
    #dsh-architecture-flow .orange { background: var(--orange-bg); border-color: color-mix(in srgb, var(--orange) 45%, var(--border)); }
    #dsh-architecture-flow .purple { background: var(--purple-bg); border-color: color-mix(in srgb, var(--purple) 45%, var(--border)); }
    #dsh-architecture-flow .red { background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
    #dsh-architecture-flow .architecture { display: grid; grid-template-columns: minmax(150px, .78fr) 34px minmax(460px, 2.25fr) 34px minmax(180px, .9fr); align-items: stretch; gap: 10px; }
    #dsh-architecture-flow .column { display: flex; flex-direction: column; gap: 9px; }
    #dsh-architecture-flow .arrow-column { display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 24px; }
    #dsh-architecture-flow .profile-stack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    #dsh-architecture-flow .profile-final { border: 1px solid color-mix(in srgb, var(--purple) 55%, var(--border)); background: var(--purple-bg); border-radius: 10px; padding: 12px; text-align: center; }
    #dsh-architecture-flow .profile-final strong { display: block; font-size: 14px; }
    #dsh-architecture-flow .profile-final span { display: block; margin-top: 4px; color: var(--muted-foreground); font-size: 11px; }
    #dsh-architecture-flow .down-arrow { color: var(--muted-foreground); text-align: center; line-height: 22px; }
    #dsh-architecture-flow .core { border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: var(--muted-bg); }
    #dsh-architecture-flow .core-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    #dsh-architecture-flow .core-grid .wide { grid-column: span 2; }
    #dsh-architecture-flow .session-flow { margin-top: 10px; display: grid; grid-template-columns: 1fr 28px 1fr 28px 1fr; align-items: center; gap: 5px; }
    #dsh-architecture-flow .mini { padding: 8px; border-radius: 8px; border: 1px dashed var(--border); text-align: center; font-size: 11px; color: var(--muted-foreground); }
    #dsh-architecture-flow .mini-arrow { text-align: center; color: var(--muted-foreground); }
    #dsh-architecture-flow .note { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #dsh-architecture-flow .callout { border-left: 3px solid var(--blue); padding: 7px 10px; background: var(--blue-bg); border-radius: 0 8px 8px 0; font-size: 12px; line-height: 1.5; }
    #dsh-architecture-flow .callout b { color: var(--foreground); }
    #dsh-architecture-flow .callout span { color: var(--muted-foreground); }

    #dsh-architecture-flow .sequence-wrap { overflow-x: auto; padding-bottom: 6px; }
    #dsh-architecture-flow .sequence { min-width: 1000px; position: relative; }
    #dsh-architecture-flow .lane-heads, #dsh-architecture-flow .seq-row { display: grid; grid-template-columns: 70px repeat(7, minmax(116px, 1fr)); gap: 8px; }
    #dsh-architecture-flow .lane-heads { position: sticky; top: 0; z-index: 4; background: var(--background); padding-bottom: 8px; }
    #dsh-architecture-flow .lane-head { border: 1px solid var(--border); border-radius: 9px; text-align: center; padding: 8px 5px; font-size: 11px; font-weight: 700; background: var(--card); }
    #dsh-architecture-flow .seq-body { position: relative; }
    #dsh-architecture-flow .seq-body::before { content: &quot;&quot;; position: absolute; inset: 0 0 0 78px; background: repeating-linear-gradient(to right, transparent 0, transparent calc((100% / 7) - 1px), var(--border) calc((100% / 7) - 1px), var(--border) calc(100% / 7)); opacity: .45; pointer-events: none; }
    #dsh-architecture-flow .phase { position: relative; border-radius: 12px; padding: 12px 8px 10px; margin-bottom: 8px; }
    #dsh-architecture-flow .phase.boot { background: var(--blue-bg); }
    #dsh-architecture-flow .phase.infer { background: var(--orange-bg); }
    #dsh-architecture-flow .phase.tools { background: var(--purple-bg); }
    #dsh-architecture-flow .phase.finish { background: var(--green-bg); }
    #dsh-architecture-flow .phase.recovery { background: var(--red-bg); }
    #dsh-architecture-flow .phase-title { display: grid; grid-template-columns: 70px 1fr; gap: 8px; margin-bottom: 8px; position: relative; z-index: 1; }
    #dsh-architecture-flow .phase-title b { font-size: 11px; letter-spacing: .05em; }
    #dsh-architecture-flow .phase-title span { font-size: 11px; color: var(--muted-foreground); }
    #dsh-architecture-flow .seq-row { min-height: 42px; align-items: center; position: relative; z-index: 1; }
    #dsh-architecture-flow .step-no { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid color-mix(in srgb, var(--orange) 55%, var(--border)); font-size: 10px; font-weight: 800; justify-self: center; }
    #dsh-architecture-flow .event { position: relative; min-height: 30px; padding: 6px 9px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-size: 11px; line-height: 1.35; }
    #dsh-architecture-flow .event::after { content: &quot;→&quot;; position: absolute; right: -20px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); font-size: 16px; }
    #dsh-architecture-flow .event.back::after { content: &quot;←&quot;; left: -20px; right: auto; }
    #dsh-architecture-flow .event.end::after { display: none; }
    #dsh-architecture-flow .event small { display: block; color: var(--muted-foreground); margin-top: 2px; }
    #dsh-architecture-flow .loop-note { grid-column: 7 / 9; border: 1px dashed color-mix(in srgb, var(--purple) 60%, var(--border)); color: var(--muted-foreground); padding: 7px 9px; border-radius: 8px; font-size: 11px; }
    #dsh-architecture-flow .legend { margin-top: 10px; color: var(--muted-foreground); font-size: 11px; line-height: 1.5; }
    @media (max-width: 760px) {
      #dsh-architecture-flow .header { align-items: flex-start; flex-direction: column; }
      #dsh-architecture-flow h1 { font-size: 20px; }
      #dsh-architecture-flow .architecture { grid-template-columns: 1fr; }
      #dsh-architecture-flow .arrow-column { transform: rotate(90deg); height: 18px; }
      #dsh-architecture-flow .core-grid { grid-template-columns: 1fr 1fr; }
      #dsh-architecture-flow .core-grid .wide { grid-column: span 2; }
      #dsh-architecture-flow .note { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      #dsh-architecture-flow .profile-stack, #dsh-architecture-flow .core-grid { grid-template-columns: 1fr; }
      #dsh-architecture-flow .core-grid .wide { grid-column: span 1; }
      #dsh-architecture-flow .session-flow { grid-template-columns: 1fr; }
      #dsh-architecture-flow .mini-arrow { transform: rotate(90deg); }
    }
  &lt;/style&gt;

  &lt;div class=&quot;header&quot;&gt;
    &lt;div&gt;
      &lt;h1&gt;DeepSeek Harness：系统结构与一次请求&lt;/h1&gt;
      &lt;div class=&quot;subtitle&quot;&gt;Profile 负责组装；Session Log 记录事实；Agent Loop 驱动模型与工具。&lt;/div&gt;

      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;seq-panel&quot; id=&quot;seq-tab&quot;&gt;一次请求&lt;/button&gt;

  &lt;section id=&quot;arch-panel&quot; class=&quot;panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;arch-tab&quot;&gt;
    &lt;div class=&quot;architecture&quot;&gt;
      &lt;div class=&quot;column&quot;&gt;
        &lt;div class=&quot;section-label&quot;&gt;入口&lt;/div&gt;
        &lt;div class=&quot;node blue&quot;&gt;&lt;strong&gt;CLI / Headless&lt;/strong&gt;&lt;span&gt;启动任务，输出最终结果&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;node blue&quot;&gt;&lt;strong&gt;API / SDK / ACP&lt;/strong&gt;&lt;span&gt;远程或自动化调用&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;node purple&quot;&gt;&lt;strong&gt;工具与能力 Provider&lt;/strong&gt;&lt;span&gt;FS、Shell、Subprocess、Skill、Workflow、MCP…&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;node green&quot;&gt;&lt;strong&gt;持久化 Provider&lt;/strong&gt;&lt;span&gt;JSONL 保存日志；SQLite 提供查询索引&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;node blue&quot;&gt;&lt;strong&gt;展示端&lt;/strong&gt;&lt;span&gt;网页、桌面或外部客户端读取投影&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;
      &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;替换实现时的约束：&lt;/b&gt; &lt;span&gt;插件注册方式、Agent / LLM / Tool / Session 接口、事件格式和生命周期规则。实现可以替换，但不能跳过这些规则。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Profile 与 Bundle：&lt;/b&gt; &lt;span&gt;Profile 是最终配置；Bundle 只是 Profile 可选择引用的配置片段。配置层按顺序应用，目标 row 的 config 整块替换。&lt;/span&gt;&lt;/div&gt;

  &lt;/section&gt;

  &lt;section id=&quot;seq-panel&quot; class=&quot;panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;seq-tab&quot; hidden&gt;
    &lt;div class=&quot;sequence-wrap&quot;&gt;
      &lt;div class=&quot;sequence&quot;&gt;
        &lt;div class=&quot;lane-heads&quot;&gt;
          &lt;div&gt;&lt;/div&gt;
          &lt;div class=&quot;lane-head blue&quot;&gt;用户 / 入口&lt;/div&gt;
          &lt;div class=&quot;lane-head purple&quot;&gt;Profile / Loader&lt;/div&gt;
          &lt;div class=&quot;lane-head red&quot;&gt;Agent Loop&lt;/div&gt;
          &lt;div class=&quot;lane-head green&quot;&gt;Session&lt;/div&gt;
          &lt;div class=&quot;lane-head orange&quot;&gt;Prompt / LLM&lt;/div&gt;
          &lt;div class=&quot;lane-head purple&quot;&gt;Tool Runtime&lt;/div&gt;
          &lt;div class=&quot;lane-head blue&quot;&gt;外部 Provider&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;seq-body&quot;&gt;
          &lt;div class=&quot;phase boot&quot;&gt;
            &lt;div class=&quot;phase-title&quot;&gt;&lt;b&gt;A · 启动&lt;/b&gt;&lt;span&gt;先完成插件安装，再暴露 Agent&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;01&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:2/3&quot;&gt;提交任务&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:3/4&quot;&gt;读取 Profile&lt;small&gt;组合 Bundle / Patch&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;02&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:3/4&quot;&gt;安装插件并等待完成&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:4/5&quot;&gt;创建 Agent&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:5/6&quot;&gt;创建 Session&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;03&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:2/3&quot;&gt;UserMessage&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:4/5&quot;&gt;写入 durable inbox&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;phase infer&quot;&gt;
            &lt;div class=&quot;phase-title&quot;&gt;&lt;b&gt;B · 第一次推理&lt;/b&gt;&lt;span&gt;所有模型可见内容先进入 Session Log&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;04&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:4/5&quot;&gt;打开 turn，领取输入&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:5/6&quot;&gt;追加 turn/start&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;05&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:4/5&quot;&gt;组装上下文并经过 pre-step&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:6/7&quot;&gt;接纳后 step/start；request / prepareCall&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;06&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:5/6&quot;&gt;提交系统、用户与请求元数据，再 deriveMessages()&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:6/7&quot;&gt;冻结、逐项比较并等待 checkpoint&lt;small&gt;实际 messages ≠ 日志派生结果 → 当前 turn 报错结束&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;07&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:6/7&quot;&gt;调用 LLM Provider&lt;/div&gt;&lt;div class=&quot;event back&quot; style=&quot;grid-column:8/9&quot;&gt;流式响应&lt;small&gt;reasoning / text / tool call&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;08&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:4/5&quot;&gt;实时流通知 UI；结算完整尝试&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:5/6&quot;&gt;assistant/message 或 attempt（内嵌 stream）&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;phase tools&quot;&gt;
            &lt;div class=&quot;phase-title&quot;&gt;&lt;b&gt;C · 工具循环&lt;/b&gt;&lt;span&gt;工具需要响应或有新输入时继续；关闭前允许注入输入&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;09&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:4/5&quot;&gt;发现 Tool Call&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:5/6&quot;&gt;写入 tool/call&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:7/8&quot;&gt;解析 JSON 参数&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;10&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:7/8&quot;&gt;pre-execute&lt;small&gt;审批 + 权限 + guard&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;event back&quot; style=&quot;grid-column:8/9&quot;&gt;执行能力&lt;small&gt;FS / Shell / Skill / Workflow / MCP&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;11&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:7/8&quot;&gt;规范化结果&lt;/div&gt;&lt;div class=&quot;event back&quot; style=&quot;grid-column:5/6&quot;&gt;写入 tool/result&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:4/5&quot;&gt;开启下一 step&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;12&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:5/6&quot;&gt;重新派生完整历史&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:6/7&quot;&gt;再次调用模型&lt;/div&gt;&lt;div class=&quot;loop-note&quot;&gt;下一 step 重新组装与准备请求；没有后续工作时结束&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;phase finish&quot;&gt;
            &lt;div class=&quot;phase-title&quot;&gt;&lt;b&gt;D · 结束&lt;/b&gt;&lt;span&gt;turn-stopping 可注入输入；没有后续工作才关闭 turn&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;13&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:4/5&quot;&gt;step/end + turn/end&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:5/6&quot;&gt;提交结束事件，由持久化句柄写入&lt;/div&gt;&lt;div class=&quot;event back end&quot; style=&quot;grid-column:2/3&quot;&gt;通知状态与已提交输出&lt;small&gt;Agent 回到 idle&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;phase recovery&quot;&gt;
            &lt;div class=&quot;phase-title&quot;&gt;&lt;b&gt;E · 重启恢复&lt;/b&gt;&lt;span&gt;不猜测崩溃前的工具是否已经产生外部影响&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;14&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:3/4&quot;&gt;进程重新启动&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:5/6&quot;&gt;选择最高日志代际、转换并校验&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;step-no&quot;&gt;15&lt;/div&gt;&lt;div class=&quot;event&quot; style=&quot;grid-column:5/6&quot;&gt;发现未完成 tool call&lt;small&gt;标记“没有开始”或“结果未知”&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;event end&quot; style=&quot;grid-column:4/5&quot;&gt;结束未完成 step / turn&lt;small&gt;避免把工具盲目重跑一遍&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;实线框表示一次明确动作；横向箭头表示调用或返回。Session 是会话历史的持久事实来源，Projection 只是为 UI 整理这些事件，不反向修改事实。&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;dsh-architecture-flow&#x27;);
      const tabs = [...root.querySelectorAll(&#x27;.tab&#x27;)];
      const panels = [...root.querySelectorAll(&#x27;.panel&#x27;)];
      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          tabs.forEach((item) =&gt; {
            const active = item === tab;
            item.classList.toggle(&#x27;active&#x27;, active);
            item.setAttribute(&#x27;aria-selected&#x27;, String(active));
          });
          panels.forEach((panel) =&gt; { panel.hidden = panel.id !== tab.getAttribute(&#x27;aria-controls&#x27;); });
        });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
